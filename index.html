	<script>
      const bgimg = document.getElementById("bg-image");
      const pfpimg = document.getElementById("pfp");

      // background
      document.addEventListener("mousemove", (e) => {
        const offsetX = (e.clientX - window.innerWidth / 2) / 20;
        const offsetY = (e.clientY - window.innerHeight / 2) / 20;

        bgimg.style.transform =
          `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
      });

      // pfp
      let timer = 0;
      function animateImage() {
        timer += 1;
        const sizeOffset = 80 + (2 * Math.sin(timer * 0.25));
        pfpimg.style.transform =
          `translate(-50%, -50%) scale(${sizeOffset / 100})`;
        setTimeout(animateImage, 33.3);
      }
      animateImage();
    </script>
