<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Shampoo | a painting program</title>
    <style>
      body {
        background: white;
        color: eee;
        font-family: sans-serif;
        margin: 0;
        padding: 20px;
      }
      .toolbar {
        margin-bottom: 10px;
      }
      canvas {
        border: 1px solid #555;
        background: white;
        cursor: crosshair;
      }
      button,input {
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Shampoo - paint</h1>
    <div class="toolbar">
      <input type="color" id="color" value="#000000">
      <input type="range" id="size" min="1" max="30" value="5">
      <button id ="eraser">Eraser</button>
      <button id ="clear">Clear</button>
    </div>

    <canvas id="canvas" width="800" height="500"></canvas>
    <script src="paint.js"></script>
  </body>
</html>
