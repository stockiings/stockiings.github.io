<script>
    // Function to load and display Markdown file
    async function loadMarkdown(filePath) {
        try {
            const response = await fetch(filePath);
            if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
            const text = await response.text();
            document.getElementById('markdown-content').innerHTML = marked.parse(text);
        } catch (error) {
            document.getElementById('markdown-content').innerHTML = `<p style="color:red;">Error loading file: ${error.message}</p>`;
        }
    }

    // Load README.md (must be in same directory or adjust path)
    loadMarkdown('my_name_is.md');
</script>
