			<div class="email">
				<p id="emailText" onclick="copyText()">Email: stockiings@proton.me</p>
			</div>
			<script>
			function copyText() {
				const el = document.getElementById("emailText");
					
				navigator.clipboard.writeText("stockiings@proton.me");
					
				const original = el.textContent;
				el.textContent="Copied!"
				el.classList.add("copied");
					
				setTimeout(() => {
					el.textContent = original;
					el.classList.remove("copied");
				}, 1200);
			}
			</script>
			
			<script>
				const bgimg = document.getElementById("bg-image");
				
				// background
				document.addEventListener("mousemove", (e) => {
				const offsetX = (e.clientX - window.innerWidth / 2) / 20;
				const offsetY = (e.clientY - window.innerHeight / 2) / 20;

					bgimg.style.transform =
					`translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
				});
			</script>
